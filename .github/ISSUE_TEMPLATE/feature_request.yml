name: Feature request
description: Propose a new feature or an improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Describe the problem before the solution: a clear problem statement makes an idea much easier to evaluate.

        For significant changes, this issue is the first step of the [planning process](https://github.com/Synaptech-Solutions-SAS/.github/blob/main/CONTRIBUTING.md#planning-significant-changes). Projects in this organization are maintained alongside a business, so replies may take a while.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests, and this hasn't been proposed yet.
          required: true
        - label: If this repository uses OpenSpec or agent-skills, I checked its planned work (open OpenSpec changes or specs).
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the need, not the solution. What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Who does it affect?
      description: Which users or use cases, and how often the problem comes up.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd solve it, described as behavior. Implementation details can come later, in the planning artifact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, including current workarounds, and why you prefer your proposal.
    validations:
      required: true
  - type: textarea
    id: existing
    attributes:
      label: What already exists
      description: Related code, features, specs, or OpenSpec changes in the repository that this builds on or affects, if you know of any.
  - type: dropdown
    id: implementation
    attributes:
      label: Would you like to implement it?
      options:
        - Yes, I'd like to implement it
        - Maybe, with some guidance
        - No, I'm only suggesting it
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, examples from other projects, links, or anything else that might help.
